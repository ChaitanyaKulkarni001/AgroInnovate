<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta
    name="description"
    content="AgroInnovate - Premium Agricultural Products and Tools"
  />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  
  <title>AgroInnovate - Agricultural Marketplace</title>
  <style>
    /* ========================================
       GLOBAL RESET & BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    }
    
    body {
      top: 0 !important;
      position: static !important;
      background-color: #f5f5f5;
    }
    
    /* ========================================
       GOOGLE TRANSLATE WIDGET STYLING
       ======================================== */
    
    /* Container for translate widget */
    #google_translate_element {
      display: inline-block !important;
      vertical-align: middle !important;
      margin: 0 8px !important;
    }
    
    /* Show the translate widget */
    #google_translate_element .skiptranslate {
      display: inline-block !important;
    }
    
    /* Style the select dropdown */
    #google_translate_element select.goog-te-combo {
      background-color: rgba(255, 255, 255, 0.2) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      border-radius: 4px !important;
      padding: 6px 28px 6px 32px !important;
      font-size: 13px !important;
      color: white !important;
      cursor: pointer !important;
      outline: none !important;
      background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg"%3e%3cpath d="M1 1L6 6L11 1" stroke="white" stroke-width="2" stroke-linecap="round"/%3e%3c/svg%3e') !important;
      background-repeat: no-repeat !important;
      background-position: right 8px center !important;
      background-size: 12px !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
    }
    
    #google_translate_element select.goog-te-combo:hover {
      background-color: rgba(255, 255, 255, 0.3) !important;
      border-color: rgba(255, 255, 255, 0.5) !important;
    }
    
    #google_translate_element select.goog-te-combo:focus {
      outline: 2px solid rgba(255, 255, 255, 0.4) !important;
      outline-offset: 2px !important;
    }
    
    #google_translate_element select.goog-te-combo option {
      background-color: white !important;
      color: #333 !important;
      padding: 8px !important;
    }
    
    /* Hide Google Translate branding */
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate {
      display: none !important;
    }
    
    .goog-logo-link,
    .goog-te-gadget span {
      display: none !important;
    }
    
    .goog-te-gadget {
      color: transparent !important;
      font-size: 0 !important;
    }
    
    /* Hide toolbar that appears at top */
    body > .skiptranslate {
      display: none !important;
    }
    
    body.translated-ltr,
    body.translated-rtl {
      top: 0 !important;
    }
    
    /* Google Translate Dropdown Styling */
    #google_translate_element {
      display: inline-block !important;
    }
    
    #google_translate_element .skiptranslate {
      display: inline-block !important;
    }
    
    #google_translate_element .goog-te-gadget-simple {
      background-color: white !important;
      border: 1px solid #ddd !important;
      padding: 5px 10px !important;
      border-radius: 4px !important;
      font-size: 13px !important;
      display: inline-block !important;
      cursor: pointer !important;
      min-width: 150px !important;
    }
    
    #google_translate_element .goog-te-gadget-simple:hover {
      background-color: #f5f5f5 !important;
      border-color: #ccc !important;
    }
    
    #google_translate_element .goog-te-gadget-simple .goog-te-menu-value {
      color: #333 !important;
      font-size: 13px !important;
      font-family: Arial, sans-serif !important;
    }
    
    #google_translate_element .goog-te-gadget-simple .goog-te-menu-value span {
      color: #333 !important;
      display: inline !important;
    }
    
    #google_translate_element .goog-te-gadget-simple .goog-te-menu-value span:first-child {
      display: inline !important;
    }
    
    /* Hide Google branding image but keep dropdown arrow */
    #google_translate_element .goog-te-gadget-icon {
      display: none !important;
    }
    
    #google_translate_element .goog-logo-link {
      display: none !important;
    }
    
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

<!-- Google Translate Script -->
<script type="text/javascript">
  function googleTranslateElementInit() {
  new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,mr,gu,kn,te,ta,ml,pa,bn,or,ur,ne,sd,as',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Bootstrap JS (Optional - for navbar collapse) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
